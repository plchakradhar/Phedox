spring.application.name=OnlineOffers

server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/onlineoffers}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Chakri122006}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
app.upload.directory=uploads/products

telegram.bot.username=${TELEGRAM_BOT_USERNAME:Orefexdealswebsitebot}
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
deal.minimum.discount.percentage=0
deals.retention.hours=32
spring.jpa.open-in-view=true

# Security & CORS Configuration
jwt.secret=${JWT_SECRET:OnlineOffersSecureJwtSecretKeyForPhedoxPlatformProductionSigningMustBeLong32Bytes}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://phedox.com,https://admin.phedox.com,https://www.phedox.com}
app.redirect.allowed-domains=${REDIRECT_ALLOWED_DOMAINS:}

# Rate Limiting & Auth Controls
security.login.max-attempts=5
security.login.lockout-minutes=15
admin.initial.username=${INITIAL_ADMIN_USERNAME:admin}
admin.initial.password=${INITIAL_ADMIN_PASSWORD:}
admin.initial.email=${INITIAL_ADMIN_EMAIL:admin@phedox.com}
