spring.application.name=OnlineOffersTest

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

telegram.bot.username=TestBot
telegram.bot.token=test_token
deal.minimum.discount.percentage=0
deals.retention.hours=32
spring.jpa.open-in-view=true

jwt.secret=TestSecretKeyForJwtAuthenticationTokenSigningMustBeVeryLong32Chars
jwt.expiration=86400000
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
security.login.max-attempts=5
security.login.lockout-minutes=15
admin.initial.username=admin
admin.initial.password=testAdminPassword123
admin.initial.email=admin@phedox.local
